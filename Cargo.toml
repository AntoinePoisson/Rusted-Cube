[package]
name = "rusted-cube"
version = "0.1.0"
edition = "2021"
description = "A small voxel sandbox written in Rust and WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
glam = "0.21.3"
js-sys = "=0.3.64"
# Pinned exactly: this project builds on Rust 1.67, and current releases of the
# proc-macro crates these pull in require a newer compiler.
wasm-bindgen = "=0.2.87"

# The LAN server lives in `server/` as its own crate, excluded here so the game
# keeps building on this toolchain regardless of the server's dependencies.
[workspace]
exclude = ["server"]

[dependencies.web-sys]
version = "=0.3.64"
features = [
    "console",
    "Document",
    "Element",
    "ErrorEvent",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "Performance",
    "PointerEvent",
    "WebSocket",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "Window",
]

[profile.release]
codegen-units = 1
lto = true
# Speed over size: meshing and noise generation dominate the frame budget.
opt-level = 3
strip = true
