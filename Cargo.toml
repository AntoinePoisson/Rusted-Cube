[package]
name = "rusted-cube"
version = "0.1.0"
edition = "2021"
rust-version = "1.67"
description = "A small voxel sandbox written in Rust and WebAssembly"
license = "MIT"
repository = "https://github.com/AntoinePoisson/Rusted-Cube"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
glam = "0.21.3"
js-sys = "=0.3.64"
# pinned, newer releases need a newer compiler than 1.67
wasm-bindgen = "=0.2.87"

[workspace]
exclude = ["server"]

[dependencies.web-sys]
version = "=0.3.64"
features = [
    "console",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "DomTokenList",
    "Element",
    "ErrorEvent",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "Performance",
    "PointerEvent",
    "VisibilityState",
    "WebSocket",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "Window",
]

[profile.release]
codegen-units = 1
lto = true
# Meshing and noise are the hot paths.
opt-level = 3
strip = true
