name: Deploy to GitHub Pages

on:
  push:
    branches: [main, prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# queue deployments instead of cancelling, don't throw away a green build
concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  # not `stable`: 1.82 changed the wasm ABI and broke wasm-bindgen 0.2.87
  RUST_VERSION: 1.76.0
  WASM_PACK_VERSION: 0.12.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add wasm32-unknown-unknown

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            server/target
          key: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-

      - name: Install wasm-pack
        run: |
          curl -sSL "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/wasm-pack'
          wasm-pack --version

      - name: Test the game
        run: cargo test --release --locked

      - name: Test the server
        run: cargo test --release --locked
        working-directory: server

      - name: Build WebAssembly
        run: wasm-pack build --target web --release

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp bootstrap.js favicon.svg llms.txt _site/
          cp -r pkg _site/pkg

          # inline the css, a separate request is a render-blocking round trip
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text()
          css = Path("styles.css").read_text()
          marker = '<link rel="stylesheet" href="./styles.css" />'
          if marker not in html:
              raise SystemExit("stylesheet link not found, update this step")
          Path("_site/index.html").write_text(html.replace(marker, f"<style>{css}</style>"))
          PY

          # or Pages runs it through Jekyll and drops paths it thinks are private
          touch _site/.nojekyll
          ls -R _site | head -30

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
