name: Deploy to GitHub Pages

on:
  push:
    branches: [main, prod]
  # Lets you redeploy the current branch tip without pushing.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue them instead of cancelling, so a green
# build is not thrown away by a later push.
concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  # Pinned rather than `stable`: this project's wasm-bindgen is 0.2.87, and
  # Rust 1.82 changed the WebAssembly ABI in a way that breaks that generation.
  RUST_VERSION: 1.76.0
  WASM_PACK_VERSION: 0.12.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add wasm32-unknown-unknown

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            server/target
          key: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-

      - name: Install wasm-pack
        run: |
          curl -sSL "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/wasm-pack'
          wasm-pack --version

      # Deploy only what passes. --locked fails loudly if Cargo.lock is stale
      # rather than silently resolving different dependency versions than the
      # ones this project is pinned to.
      - name: Test the game
        run: cargo test --release --locked

      - name: Test the server
        run: cargo test --release --locked
        working-directory: server

      - name: Build WebAssembly
        run: wasm-pack build --target web --release

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp bootstrap.js favicon.svg llms.txt _site/
          cp -r pkg _site/pkg

          # Inline the stylesheet. Fetching it separately is a render-blocking
          # round trip that costs roughly 300 ms of first paint; styles.css
          # stays the single source of truth and is inlined only here.
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text()
          css = Path("styles.css").read_text()
          marker = '<link rel="stylesheet" href="./styles.css" />'
          if marker not in html:
              raise SystemExit("stylesheet link not found — update this step")
          Path("_site/index.html").write_text(html.replace(marker, f"<style>{css}</style>"))
          PY

          # Without this, Pages runs the output through Jekyll and drops paths
          # it considers private.
          touch _site/.nojekyll
          ls -R _site | head -30

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
